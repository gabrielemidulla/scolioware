[project]
name = "scoliosoft-inference"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E402",
  "E501",
  "B008",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
