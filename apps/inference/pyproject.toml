[project]
name = "scoliosoft-inference"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []  # use requirements.txt in Docker; local dev: pip install -r requirements.txt

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E402",  # dotenv before imports in main
  "E501",  # long SQL / docstrings
  "B008",  # FastAPI File/Form/Body defaults
  "B905",  # zip without strict= (py311+)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
