# =============================================================================
# Public vhost (host port 8080 → container :80). Browser-facing.
# Storage proxy and inference /internal/* are intentionally unreachable here.
# =============================================================================
server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Storage proxy is served exclusively by the private vhost on :81 (Docker
    # network only). Refusing it here keeps the R2 surface off the public port.
    location = /internal_r2_blob.php { return 404; }

    # Logged-in users can reach `/inference/<x>` (session-protected, see below);
    # `/inference/internal/<x>` would otherwise expose Python internal routes
    # (recompute-landmarks, llm-impression). Block them at the edge — these are
    # for PHP→inference server-to-server calls and never need a public path.
    location ~ ^/inference/internal(/|$) { return 404; }

    location = /inference_session_auth.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_URI /inference_session_auth.php;
        fastcgi_param REQUEST_URI /inference_session_auth.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_pass_request_body off;
        fastcgi_pass_request_headers on;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 10s;
        fastcgi_send_timeout 10s;
        fastcgi_pass php:9000;
    }

    location ~ ^/inference/(.+)$ {
        auth_request /inference_session_auth.php;
        set $inf inference;
        proxy_pass http://$inf:8000/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Symfony front controller (see symfony.com doc "nginx").
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        set $phpfpm php:9000;
        fastcgi_pass $phpfpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # /report_image.php and /pdf.php are served by Symfony (see ReportImageController, PdfStreamController).

    # Do not add `location ~ \.php$ { return 404; }`: nginx prefers regex locations over the
    # prefix `location /`, so /login.php would never reach try_files → index.php.

    location ~ /\.ht {
        deny all;
    }
}

# =============================================================================
# Private vhost (Docker bridge only — port 81 is NOT published to the host in
# docker-compose.yaml). Inference / workers reach this via DASHBOARD_STORAGE_URL
# = http://nginx:81. Authorization is by network reachability rather than a
# shared secret: only services on the same Docker network can connect.
#
# `INTERNAL_PROXY 1` is forwarded to PHP so InternalR2BlobController can refuse
# requests that somehow arrive through any other path — defense-in-depth in
# case this listener is later misconfigured.
# =============================================================================
server {
    listen 81;
    server_name nginx;
    root /var/www/html/public;
    client_max_body_size 50M;

    location = /internal_r2_blob.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param INTERNAL_PROXY 1;
        fastcgi_connect_timeout 30s;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_pass php:9000;
    }

    location / { return 404; }
}
