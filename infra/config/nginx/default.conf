server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 50M;

    # Docker embedded DNS — re-resolve service names when upstream containers restart
    # (avoids 502 after php/migrate recreate while nginx stays up).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy /inference/<path> → FastAPI /<path> (literal prefix strip + dynamic DNS via variable host).
    location ~ ^/inference/(.+)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $inf inference;
        proxy_pass http://$inf:8000/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $phpfpm php:9000;
        fastcgi_pass $phpfpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
