server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 50M;

    # Docker embedded DNS — re-resolve service names when upstream containers restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Session check before proxying to inference (P0: no anonymous API use through the app host).
    # Keep the auth subrequest fast: no body forwarded, short FastCGI timeouts.
    location = /inference_session_auth.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/inference_session_auth.php;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_pass_request_body off;
        fastcgi_pass_request_headers on;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 10s;
        fastcgi_send_timeout 10s;
        fastcgi_pass php:9000;
    }

    # Proxy /inference/<path> → FastAPI /<path> (only after auth_request succeeds)
    location ~ ^/inference/(.+)$ {
        auth_request /inference_session_auth.php;
        set $inf inference;
        proxy_pass http://$inf:8000/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The LLM draft endpoint used to block synchronously and needed a 600s
    # timeout. Generation now runs asynchronously in the `inference-worker-llm`
    # container; this PHP handler just enqueues the job and the dashboard
    # polls GET for status updates, so the default 60s is plenty here.

    location ~ \.php$ {
        set $phpfpm php:9000;
        fastcgi_pass $phpfpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
