; Local override for PHP-FPM pool sizing. The default 5 workers is too tight
; once the dashboard polls /inference/reports/{id} every 4s through the
; nginx auth_request → PHP loop, especially with concurrent uploads.
[www]
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
