services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ../apps/dashboard/src:/var/www/html
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
      inference:
        condition: service_started
    networks:
      - app-network

  php:
    build:
      context: ..
      dockerfile: infra/docker/dashboard/Dockerfile
    volumes:
      - ../apps/dashboard/src:/var/www/html
      - ./config/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      INFERENCE_INTERNAL_URL: http://inference:8000
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot_password",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - app-network

  migrate:
    image: mysql:8.0
    restart: "no"
    entrypoint: ["/bin/bash", "/run.sh"]
    volumes:
      - ./migrations/run.sh:/run.sh:ro
      - ./migrations/sql:/sql:ro
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  inference:
    build:
      context: ..
      dockerfile: infra/docker/inference/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MODEL_DIR: /app/models
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - ../apps/inference/models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
