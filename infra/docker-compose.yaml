services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ../apps/dashboard/src:/var/www/html
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
      inference:
        condition: service_started
    networks:
      - app-network

  php:
    build:
      context: ..
      dockerfile: infra/docker/dashboard/Dockerfile
    env_file:
      - ../apps/dashboard/src/.env
    volumes:
      - ../apps/dashboard/src:/var/www/html
      - ./config/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      INFERENCE_INTERNAL_URL: http://inference:8000
      # HTTP on port 8080: set 1 in production behind HTTPS
      SW_COOKIE_SECURE: "0"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot_password",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - app-network

  migrate:
    image: mysql:8.0
    restart: "no"
    entrypoint: ["/bin/bash", "/run.sh"]
    volumes:
      - ./migrations/run.sh:/run.sh:ro
      - ./migrations/sql:/sql:ro
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  inference:
    build:
      context: ..
      dockerfile: infra/docker/inference/Dockerfile
    env_file:
      - ../apps/inference/.env
    environment:
      MODEL_DIR: /app/models
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      REDIS_URL: redis://redis:6379/0
      # Storage proxy: nginx :81 on the Docker network (see dashboard internal vhost).
      DASHBOARD_STORAGE_URL: ${DASHBOARD_STORAGE_URL:-http://nginx:81}
      # In-compose Ollama by default; on Mac use host Ollama + host.docker.internal (see Ollama section below).
      OLLAMA_INTERNAL_URL: ${OLLAMA_INTERNAL_URL:-http://ollama:11434}
    volumes:
      - ../apps/inference/models:/app/models
      - ../apps/inference/src:/app/src:ro
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  inference-worker:
    build:
      context: ..
      dockerfile: infra/docker/inference/Dockerfile
    env_file:
      - ../apps/inference/.env
    environment:
      MODEL_DIR: /app/models
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      REDIS_URL: redis://redis:6379/0
      DASHBOARD_STORAGE_URL: ${DASHBOARD_STORAGE_URL:-http://nginx:81}
      OLLAMA_INTERNAL_URL: ${OLLAMA_INTERNAL_URL:-http://ollama:11434}
    volumes:
      - ../apps/inference/models:/app/models
      - ../apps/inference/src:/app/src:ro
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # SimpleWorker + warm start in worker_main; no uvicorn entrypoint here.
    entrypoint: []
    working_dir: /app
    command: ["python", "-u", "worker_main.py"]
    restart: unless-stopped
    networks:
      - app-network

  # LLM queue worker (same image as inference; no model warm-up).
  inference-worker-llm:
    build:
      context: ..
      dockerfile: infra/docker/inference/Dockerfile
    env_file:
      - ../apps/inference/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: php_commerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      REDIS_URL: redis://redis:6379/0
      DASHBOARD_STORAGE_URL: ${DASHBOARD_STORAGE_URL:-http://nginx:81}
      OLLAMA_INTERNAL_URL: ${OLLAMA_INTERNAL_URL:-http://ollama:11434}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    entrypoint: []
    working_dir: /app
    command: ["python", "-u", "worker_llm_main.py"]
    restart: unless-stopped
    networks:
      - app-network

  # Optional in-docker Ollama (MedGemma etc.). Pick one profile: scripts/run.sh sets it, or
  # `docker compose --profile cpu|gpu-nvidia|gpu-amd up`. Apple Silicon: run Ollama on the host,
  # set OLLAMA_INTERNAL_URL=http://host.docker.internal:11434 in apps/inference/.env, skip these profiles.
  # All variants publish the hostname `ollama` on the app network.

  ollama-cpu: &ollama-base
    profiles: ["cpu"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      app-network:
        aliases: [ollama]

  ollama-nvidia:
    <<: *ollama-base
    profiles: ["gpu-nvidia"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  ollama-amd:
    <<: *ollama-base
    profiles: ["gpu-amd"]
    image: ollama/ollama:rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  # Pulls OLLAMA_LLM_MODEL once the ollama-* service is up (in-docker profiles only).
  ollama-init:
    profiles: ["cpu", "gpu-nvidia", "gpu-amd"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama-cpu:
        condition: service_healthy
        required: false
      ollama-nvidia:
        condition: service_healthy
        required: false
      ollama-amd:
        condition: service_healthy
        required: false
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-medgemma:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$OLLAMA_LLM_MODEL\""]
    networks:
      - app-network

volumes:
  mysql_data:
  ollama_models:

networks:
  app-network:
    driver: bridge
